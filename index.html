<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a15">
  <meta name="description" content="Noor Al Quran — a calm Quran reading and Islamic companion experience.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Noor Al Quran</title>
  <style>
    :root{color-scheme:dark;--bg:#06130f;--surface:#0c211a;--surface2:#102b21;--surface3:#18382b;--text:#f7f4e9;--muted:#b0c2b7;--gold:#d8b86a;--line:#294438;--shadow:0 18px 50px #0005;--radius:24px}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -20%,#174b35 0,transparent 47%),var(--bg);display:grid;place-items:center;padding:24px}
    .splash{width:min(440px,100%);text-align:center;padding:42px 28px 34px;border:1px solid #d8b86a42;border-radius:34px;background:linear-gradient(145deg,#102b21eF,#07130ff2);box-shadow:var(--shadow);position:relative;overflow:hidden}.splash:before{content:"";position:absolute;inset:12px;border:1px solid #d8b86a22;border-radius:26px;pointer-events:none}.ornament{color:var(--gold);font-size:22px;letter-spacing:12px;margin-bottom:26px}.app-icon{width:100px;height:100px;object-fit:contain;border-radius:24px;border:1px solid #d8b86a55;background:#071a15;margin:0 auto 22px;box-shadow:0 0 42px #d8b86a20}.brand{font-size:clamp(29px,8vw,38px);line-height:1.1;letter-spacing:-1px;margin:0;font-weight:760}.brand span{color:var(--gold)}.sub{color:var(--muted);margin:14px 0 0}.bismillah{font-family:"Noto Naskh Arabic","Amiri","Times New Roman",serif;font-size:26px;line-height:2;color:var(--gold);margin:26px 0}.progress{height:3px;background:#ffffff12;border-radius:8px;overflow:hidden;margin:26px 10px 14px}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#8e6c2b,var(--gold));animation:load 3s linear forwards}.open{color:var(--gold);text-decoration:none;font-size:13px}.open:focus-visible{outline:2px solid var(--gold);outline-offset:5px;border-radius:4px}@keyframes load{to{width:100%}}@media(prefers-reduced-motion:reduce){.progress span{animation:none;width:100%}}
  </style>
  <script>
    window.setTimeout(function(){ location.replace(new URL('./home.html', location.href).href); }, 3000);
  </script>
</head>
<body>
  <main class="splash" aria-label="Noor Al Quran splash screen">
    <div class="ornament" aria-hidden="true">✧ ۞ ✧</div>
    <img class="app-icon" src="./icon.png" alt="Noor Al Quran app icon" onerror="this.style.display='none'">
    <h1 class="brand">Noor <span>Al Quran</span></h1>
    <p class="sub">A moment of calm. A lifetime of guidance.</p>
    <p class="bismillah" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
    <div class="progress" role="progressbar" aria-label="Opening Noor Al Quran"><span></span></div>
    <a class="open" href="./home.html">Open now</a>
  </main>
</body>
</html>
